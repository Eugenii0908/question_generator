<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор учебных вопросов</title>
    <style>
        :root {
            --bg-main: #121212;
            --bg-card: #1E1E1E;
            --bg-input: #2D2D2D;
            --bg-hover: #333333;
            --text-main: #E0E0E0;
            --text-muted: #A0A0A0;
            --primary: #6366F1;
            --primary-hover: #4F46E5;
            --border: #333333;
            --danger: #EF4444;
            --danger-hover: #DC2626;
            --success: #10B981;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            background-color: var(--bg-card);
            width: 100%;
            max-width: 800px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            padding: 30px;
        }

        h1 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 24px;
            font-weight: 600;
            color: #FFFFFF;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 10px;
        }

        .tab {
            padding: 10px 20px;
            cursor: pointer;
            font-weight: 600;
            color: var(--text-muted);
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .tab:hover {
            background-color: var(--bg-hover);
            color: var(--text-main);
        }

        .tab.active {
            background-color: var(--primary);
            color: white;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 14px;
            color: var(--text-main);
        }

        input[type="text"],
        textarea,
        input[type="number"] {
            width: 100%;
            padding: 12px;
            background-color: var(--bg-input);
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 8px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 15px;
            transition: border-color 0.2s;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        textarea {
            height: 180px;
            resize: vertical;
        }

        button {
            background-color: var(--primary);
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            transition: background-color 0.2s;
        }

        button:hover:not(:disabled) {
            background-color: var(--primary-hover);
        }

        button:disabled {
            background-color: var(--bg-hover);
            color: var(--text-muted);
            cursor: not-allowed;
        }

        .btn-danger {
            background-color: var(--danger);
            width: auto;
            padding: 8px 16px;
            font-size: 14px;
        }

        .btn-danger:hover {
            background-color: var(--danger-hover);
        }

        .btn-clear {
            background-color: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-main);
            margin-top: 10px;
        }

        .btn-clear:hover {
            background-color: var(--bg-hover);
        }

        /* Стиль для кнопки загрузки файла */
        .btn-upload {
            background-color: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-main);
            width: auto;
            padding: 8px 15px;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .btn-upload:hover {
            background-color: var(--bg-hover);
        }

        .upload-status {
            font-size: 13px;
            margin-left: 10px;
            color: var(--text-muted);
        }

        #status {
            text-align: center;
            margin-top: 15px;
            font-weight: 500;
            padding: 10px;
            border-radius: 6px;
        }

        .status-error {
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--danger);
        }

        .status-success {
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--success);
        }

        .status-loading {
            background-color: rgba(99, 102, 241, 0.1);
            color: var(--primary);
        }

        .result-box {
            margin-top: 25px;
            padding: 20px;
            background-color: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 8px;
            display: none;
        }

        .question-block {
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }

        .question-block:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .q-text {
            font-weight: 600;
            margin-bottom: 6px;
            color: #FFFFFF;
        }

        .a-text {
            color: var(--text-muted);
            font-size: 15px;
            line-height: 1.5;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--bg-input);
            border: 1px solid var(--border);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 12px;
            transition: all 0.2s;
            cursor: pointer;
        }

        .history-item:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .history-info h4 {
            margin: 0 0 4px 0;
            font-size: 16px;
            color: #FFFFFF;
        }

        .history-info p {
            margin: 0;
            color: var(--text-muted);
            font-size: 13px;
        }

        .empty-msg {
            text-align: center;
            color: var(--text-muted);
            padding: 30px;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background-color: var(--bg-card);
            width: 90%;
            max-width: 700px;
            max-height: 85vh;
            border-radius: 12px;
            padding: 25px;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 24px;
            cursor: pointer;
            width: auto;
            padding: 0;
        }

        .close-btn:hover {
            color: var(--text-main);
            background: none;
        }

        .modal-section {
            margin-bottom: 20px;
        }

        .modal-section h3 {
            color: var(--primary);
            border-bottom: 1px solid var(--border);
            padding-bottom: 5px;
            margin-bottom: 10px;
        }

        .source-text {
            background-color: var(--bg-input);
            padding: 15px;
            border-radius: 8px;
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Генератор учебных вопросов</h1>

        <div class="tabs">
            <div class="tab active" id="tab-gen" onclick="switchTab('generator')">Генератор</div>
            <div class="tab" id="tab-hist" onclick="switchTab('history')">История</div>
        </div>

        <!-- БЛОК ГЕНЕРАЦИИ -->
        <div id="generator-tab">
            <div class="form-group">
                <label>Название набора:</label>
                <input type="text" id="name" placeholder="Например: Основы нейросетей">
            </div>

            <div class="form-group">
                <label>Учебный текст:</label>

                <!-- Универсальная кнопка для PDF и Word -->
                <div style="margin-bottom: 10px; display: flex; align-items: center;">
                    <input type="file" id="fileInput" accept=".pdf, .docx" style="display: none;"
                        onchange="uploadFile(event)">
                    <button type="button" class="btn-upload" onclick="document.getElementById('fileInput').click()">
                        📄 Загрузить PDF или Word
                    </button>
                    <span id="uploadStatus" class="upload-status"></span>
                </div>

                <textarea id="text" placeholder="Вставьте сюда текст лекции или загрузите файл..."></textarea>
            </div>

            <div class="form-group">
                <label>Количество вопросов (от 1 до 15):</label>
                <input type="number" id="num_questions" value="3" min="1" max="15">
            </div>

            <button id="generateBtn" onclick="generate()">Сгенерировать</button>
            <button class="btn-clear" onclick="clearForm()">Очистить поля</button>

            <div id="status"></div>
            <div id="result" class="result-box"></div>
        </div>

        <!-- БЛОК ИСТОРИИ -->
        <div id="history-tab" style="display: none;">
            <div style="margin-bottom: 20px;">
                <h3 style="margin: 0;">Сохраненные наборы</h3>
            </div>
            <div id="historyList"></div>
        </div>

    </div>

    <!-- МОДАЛЬНОЕ ОКНО -->
    <div class="modal-overlay" id="viewModal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="close-btn" onclick="closeModal()">✕</button>
            <h2 id="modalTitle" style="margin-top: 0; color: #fff;"></h2>
            <p id="modalDate" style="color: var(--text-muted); font-size: 14px; margin-bottom: 20px;"></p>
            <div class="modal-section">
                <h3>Исходный текст</h3>
                <div class="source-text" id="modalSource"></div>
            </div>
            <div class="modal-section">
                <h3>Вопросы и ответы</h3>
                <div id="modalQuestions"></div>
            </div>
        </div>
    </div>

    <script>
        let historyCache = [];
        let isGenerating = false;

        // --- ФОРМАТИРОВАНИЕ ДАТЫ ---
        function formatDate(dateString) {
            if (!dateString) return "Дата неизвестна";
            try {
                const date = new Date(dateString);
                if (isNaN(date.getTime())) return dateString;
                const day = String(date.getDate()).padStart(2, '0');
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const year = date.getFullYear();
                const hours = String(date.getHours()).padStart(2, '0');
                const minutes = String(date.getMinutes()).padStart(2, '0');
                return `${day}.${month}.${year} ${hours}:${minutes}`;
            } catch (e) { return dateString; }
        }

        // Функция для перевода ошибок FastAPI/Pydantic на человеческий язык
        function translateError(data) {
            // Если сервер вернул просто строку (например, наша ошибка 409 про дубликат имени)
            if (data.detail && typeof data.detail === 'string') {
                return data.detail;
            }

            // Если это ошибки валидации Pydantic (массив)
            if (data.detail && Array.isArray(data.detail)) {
                let messages = [];

                data.detail.forEach(err => {
                    // Достаем имя поля, на котором произошла ошибка (последний элемент в loc)
                    let fieldName = err.loc ? err.loc[err.loc.length - 1] : "Поле";

                    // Переводим стандартные системные названия на русский
                    if (fieldName === "name") fieldName = "Название набора";
                    if (fieldName === "text") fieldName = "Учебный текст";
                    if (fieldName === "num_questions") fieldName = "Количество вопросов";

                    // Переводим тип ошибки
                    let msg = "";
                    if (err.type === "string_too_short") {
                        // Исправлено: min_length
                        msg = `слишком короткое (минимум ${err.ctx?.min_length || 1} символов)`;
                    } else if (err.type === "string_too_long") {
                        // Исправлено: max_length
                        msg = `слишком длинное (максимум ${err.ctx?.max_length || 15000} символов)`;
                    } else if (err.type === "less_than_equal") {
                        msg = `должно быть не больше ${err.ctx?.le}`;
                    } else if (err.type === "greater_than_equal") {
                        msg = `должно быть не меньше ${err.ctx?.ge}`;
                    } else if (err.type === "missing") {
                        msg = `обязательное поле, но оно не заполнено`;
                    } else if (err.type === "int_parsing") {
                        msg = `должно быть числом`;
                    } else {
                        msg = err.msg;
                    }

                    messages.push(`${fieldName}: ${msg}`);
                });

                return messages.join('. ');
            }

            return "Произошла неизвестная ошибка";
        }

        function switchTab(tabName) {
            document.getElementById('tab-gen').classList.remove('active');
            document.getElementById('tab-hist').classList.remove('active');
            document.getElementById('generator-tab').style.display = 'none';
            document.getElementById('history-tab').style.display = 'none';

            // Очищаем статус ТОЛЬКО если генерация не идет прямо сейчас
            if (!isGenerating) {
                document.getElementById('status').innerHTML = '';
                document.getElementById('result').style.display = 'none';
            }

            if (tabName === 'generator') {
                document.getElementById('tab-gen').classList.add('active');
                document.getElementById('generator-tab').style.display = 'block';
            } else {
                document.getElementById('tab-hist').classList.add('active');
                document.getElementById('history-tab').style.display = 'block';
                loadHistory();
            }
        }

        // --- ЗАГРУЗКА ФАЙЛА (PDF или DOCX) ---
        async function uploadFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const statusSpan = document.getElementById('uploadStatus');
            const textArea = document.getElementById('text');

            statusSpan.innerHTML = "Чтение файла... ⏳";
            statusSpan.style.color = "var(--primary)";

            const formData = new FormData();
            formData.append("file", file);

            try {
                // Стучимся в единый эндпоинт /files
                const response = await fetch('/files', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    textArea.value = data.text;
                    statusSpan.innerHTML = `✅ Успешно (${data.text.length} символов)`;
                    statusSpan.style.color = "var(--success)";
                } else {
                    let errorMsg = typeof data.detail === 'string' ? data.detail : "Ошибка чтения";
                    statusSpan.innerHTML = `❌ ${errorMsg}`;
                    statusSpan.style.color = "var(--danger)";
                }
            } catch (error) {
                statusSpan.innerHTML = `❌ Ошибка сети`;
                statusSpan.style.color = "var(--danger)";
            } finally {
                event.target.value = ''; // Очищаем инпут
            }
        }

        // --- ОЧИСТКА ПОЛЕЙ ---
        function clearForm() {
            document.getElementById('name').value = '';
            document.getElementById('text').value = '';
            document.getElementById('num_questions').value = '3';
            document.getElementById('status').innerHTML = '';
            document.getElementById('status').className = '';
            document.getElementById('result').style.display = 'none';
            document.getElementById('uploadStatus').innerHTML = '';
            document.getElementById('name').focus();
        }

        async function generate() {
            const name = document.getElementById('name').value.trim();
            const text = document.getElementById('text').value.trim();
            const num_questions = parseInt(document.getElementById('num_questions').value);
            const statusDiv = document.getElementById('status');
            const resultDiv = document.getElementById('result');
            const btn = document.getElementById('generateBtn');

            statusDiv.className = ""; statusDiv.innerHTML = "";
            resultDiv.style.display = "none";

            if (!name || !text || !num_questions) {
                statusDiv.className = "status-error"; statusDiv.innerHTML = 'Заполнены не все поля!';
                return;
            }

            btn.disabled = true;
            isGenerating = true;
            statusDiv.className = "status-loading";
            statusDiv.innerHTML = 'Генерация вопросов... Пожалуйста, подождите. ⏳';

            try {
                const response = await fetch('/request', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: name, text: text, num_questions: num_questions })
                });

                const data = await response.json();

                if (response.ok) {
                    statusDiv.className = "status-success";
                    statusDiv.innerHTML = 'Успешно сгенерировано и сохранено!';
                    resultDiv.style.display = "block";

                    let html = '<h3 style="margin-top:0; color:white;">Сгенерированные вопросы:</h3>';
                    const questionsArray = Array.isArray(data.response) ? data.response : [];
                    questionsArray.forEach((item, index) => {
                        html += `<div class="question-block">
                        <div class="q-text">${index + 1}. ${item.question}</div>
                        <div class="a-text"><strong>Ответ:</strong> ${item.answer}</div>
                    </div>`;
                    });
                    resultDiv.innerHTML = html;
                    document.getElementById('name').value = '';
                }
                else {
                    // Вызываем наш переводчик
                    let errorMsg = translateError(data);

                    statusDiv.className = "status-error";
                    // Выводим понятный текст
                    statusDiv.innerHTML = `Ошибка: ${errorMsg}`;
                }
            } catch (error) {
                statusDiv.className = "status-error";
                statusDiv.innerHTML = `Ошибка сети: ${error.message}`;
            } finally {
                btn.disabled = false;
            }
        }

        async function loadHistory() {
            const listDiv = document.getElementById('historyList');
            listDiv.innerHTML = '<div class="empty-msg">Загрузка...</div>';

            try {
                const response = await fetch('/request');
                if (!response.ok) throw new Error(`Статус ${response.status}`);
                const data = await response.json();
                historyCache = data;

                if (data && data.length > 0) {
                    listDiv.innerHTML = '';
                    data.forEach((item, index) => {
                        const div = document.createElement('div');
                        div.className = 'history-item';
                        div.onclick = () => openModal(index);
                        div.innerHTML = `
                        <div class="history-info">
                            <h4>${item.name}</h4>
                            <p>Дата: ${formatDate(item.date)}</p> 
                        </div>
                        <div class="history-actions">
                            <button class="btn-danger" onclick="event.stopPropagation(); deleteRequest('${item.name}')">Удалить</button>
                        </div>
                    `;
                        listDiv.appendChild(div);
                    });
                } else {
                    listDiv.innerHTML = '<div class="empty-msg">История пуста. Сгенерируйте первый набор!</div>';
                }
            } catch (error) {
                listDiv.innerHTML = `<div class="status-error" style="margin-top:10px;">Не удалось загрузить историю: ${error.message}</div>`;
            }
        }

        async function deleteRequest(name) {
            if (!confirm(`Вы уверены, что хотите удалить набор "${name}"?`)) return;
            try {
                const response = await fetch(`/request/${encodeURIComponent(name)}`, { method: 'DELETE' });
                if (response.ok) loadHistory();
                else alert(`Ошибка при удалении`);
            } catch (error) { alert(`Ошибка сети: ${error.message}`); }
        }

        function openModal(index) {
            const item = historyCache[index];
            if (!item) return;
            document.getElementById('modalTitle').innerText = item.name;
            document.getElementById('modalDate').innerText = `Дата создания: ${formatDate(item.date)}`;
            document.getElementById('modalSource').innerText = item.text || "Текст не сохранен";
            const qContainer = document.getElementById('modalQuestions');
            qContainer.innerHTML = '';
            const questionsArray = Array.isArray(item.response) ? item.response : [];

            if (questionsArray.length > 0) {
                questionsArray.forEach((q, i) => {
                    qContainer.innerHTML += `
                    <div class="question-block" style="background:var(--bg-input); padding: 15px; border-radius:8px; margin-bottom:10px; border:none;">
                        <div class="q-text">${i + 1}. ${q.question}</div>
                        <div class="a-text"><strong>Ответ:</strong> ${q.answer}</div>
                    </div>
                `;
                });
            } else {
                qContainer.innerHTML = '<p class="text-muted">Вопросы не найдены.</p>';
            }
            document.getElementById('viewModal').classList.add('active');
        }

        function closeModal(event) {
            if (!event || event.target.id === 'viewModal' || event.target.classList.contains('close-btn')) {
                document.getElementById('viewModal').classList.remove('active');
            }
        }
    </script>

</body>

</html>
